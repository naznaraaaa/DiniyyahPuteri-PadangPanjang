<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Diniyyah Puteri</title>

    <!-- Font lokal -->
    <link rel="stylesheet" href="assets/global/fonts/fonts.css">

    <!-- CSS -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/loading.css">
    <link rel="stylesheet" href="css/opening.css">
    <link rel="stylesheet" href="css/responsive.css">

</head>


<body class="is-loading">

    <!-- ==================================================
         LOADING PAGE
    ================================================== -->

    <section
        id="loading-screen"
        aria-label="Loading"
    >
        <!-- FOTO LAMA -->

        <div class="loading-background">

            <img
                src="assets/opening/images/diniyyah-old.webp"
                alt=""
            >

        </div>


        <!-- FOTO MODERN
             HANYA TERLIHAT DI DALAM SPOTLIGHT -->

        <div
            class="loading-current-image"
            aria-hidden="true"
        >

            <img
                src="assets/opening/images/diniyyah-now.webp"
                alt=""
            >

        </div>


        <!-- OVERLAY -->

        <div class="loading-overlay"></div>


        <!-- LOADING INFO -->

        <div class="loading-info">

            <span
                id="loading-percentage"
                class="loading-percentage"
            >
                0%
            </span>

            <span
                id="loading-text"
                class="loading-text"
            >
                Loading.
            </span>

        </div>


    </section>



    <!-- ==================================================
         ENTRY PAGE
    ================================================== -->

    <main id="entry-page">


        <!-- FOTO MASA KINI -->

        <div class="entry-background">

            <img
                src="assets/opening/images/diniyyah-scroll.webp"
                alt="Diniyyah Puteri masa kini"
            >

        </div>


        <!-- DECORATIVE CORNERS -->
        <div class="opening-decorations" aria-hidden="true">
            <img
                class="opening-decoration opening-decoration--top-left"
                src="assets/opening/images/kiriatas.webp"
                alt=""
            >

            <img
                class="opening-decoration opening-decoration--top-right"
                src="assets/opening/images/kananatas.webp"
                alt=""
            >

            <img
                class="opening-decoration opening-decoration--bottom"
                src="assets/opening/images/bawah.webp"
                alt=""
            >
        </div>


        <!-- OVERLAY -->

        <div class="entry-overlay"></div>


        <!-- LOGO -->

        <div class="entry-content">

            <img
                class="entry-logo"
                src="assets/logo/logo-diniyyah.webp"
                alt="Diniyyah Puteri"
            >

        </div>

        <!-- SCROLL TO BEGIN (di atas kertas bawah) -->
        <div class="scroll-indicator" role="button" tabindex="0" aria-label="Mulai">
            <span class="scroll-text">Scroll To Begin</span>
            <img class="scroll-icon"
                 src="assets/global/icons/scroll.webp"
                 alt="" aria-hidden="true">
        </div>

        <!-- SOUND (kiri bawah, ikon sama seperti di tiap chapter) -->
        <button
            id="audio-toggle"
            class="audio-toggle"
            type="button"
            aria-label="Mute audio"
        >
            <img id="audio-icon" class="audio-icon"
                 src="assets/global/icons/SoundOff.webp" alt="">
            <span id="audio-label" class="sr-only">Sound</span>
        </button>


    </main>

    <!-- ==================================================
         AUDIO
    ================================================== -->
    <audio
    id="background-audio"
    src="assets/global/sound/Backsound.mp3"
    loop
    preload="auto"
    ></audio>
    
    <!-- ==================================================
         JAVASCRIPT
    ================================================== -->

    <script src="js/main.js"></script>
    <script src="js/loading.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/opening.js"></script>

</body>
</html>
